name: Signed iOS build

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Unused App Store Connect build number for the version in frontend/pubspec.yaml
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: signed-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' && github.repository == 'jeethsuresh/spacetime'
    runs-on: macos-26
    timeout-minutes: 45
    environment: ios-release
    defaults:
      run:
        working-directory: frontend
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
      BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install the pinned Flutter SDK
        run: |
          xcodebuild -version
          git clone --depth 1 --branch 3.32.0-0.2.pre https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = d3abd00e69a89a615e13969c02832ef1e0119639
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Test and prepare iOS before loading signing credentials
        run: |
          flutter --no-version-check pub get --enforce-lockfile
          flutter --no-version-check analyze --no-pub
          flutter --no-version-check test --no-pub
          flutter --no-version-check build ios --config-only --release --no-codesign --no-pub --build-number "$BUILD_NUMBER"
          cd ios
          pod install --deployment
      - name: Archive, sign and verify the app and widget
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
          IOS_WIDGET_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_PROFILE_BASE64 }}
        run: |
          python3 ../scripts/ios-release.py \
            --bundle-id com.jeethsuresh.spacetime --artifact-name Spacetime --production-push \
            --build-number "$BUILD_NUMBER" --output "$RUNNER_TEMP/signed-ios"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Spacetime-iOS-${{ inputs.build_number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/signed-ios/
          if-no-files-found: error
          retention-days: 14
