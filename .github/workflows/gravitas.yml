name: Gravitas web deployment
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, deploy/gravitas]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gravitas-web-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  image:
    if: github.event_name != 'pull_request' || github.head_ref != 'deploy/gravitas' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Test Go backend in the production toolchain
        run: docker buildx build --target backend-test .
      - name: Analyze and test Flutter with the pinned SDK
        run: docker buildx build --target frontend-test .
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build immutable release
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ghcr.io/jeethsuresh/spacetime:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the restricted runtime container
        run: |
          docker run --detach --name spacetime-smoke --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges --tmpfs /tmp \
            --tmpfs /data:uid=10001,gid=10001,mode=0700 \
            -e REGISTRATION_INVITE_KEY=runtime-smoke-test \
            -p 127.0.0.1:8080:8080 ghcr.io/jeethsuresh/spacetime:${{ github.sha }}
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8080/healthz; then break; fi
            sleep 1
          done
          python3 deploy/gravitas/smoke.py http://127.0.0.1:8080
      - name: Runtime diagnostics
        if: failure()
        run: docker logs spacetime-smoke || true
      - name: Remove smoke container
        if: always()
        run: docker rm --force spacetime-smoke || true
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [image, desktop-verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: gravitas
      url: "https://spacetime.gravitas.cool"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch pinned private deployment tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jeethsuresh/gravitas-deploy
          ref: 1672e6fef247f5ba36ed07ac178dc41482cddaba
          path: .gravitas-runtime
          ssh-key: ${{ secrets.GRAVITAS_TOOLING_SSH_KEY }}
          persist-credentials: false
      - name: Deploy and verify immutable release
        uses: ./.gravitas-runtime
        with:
          config: .gravitas/deploy.json
          image: ghcr.io/jeethsuresh/spacetime@${{ needs.image.outputs.digest }}
          kubeconfig: ${{ secrets.GRAVITAS_KUBECONFIG }}

  desktop:
    name: Native desktop (${{ matrix.platform }} ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, platform: linux, arch: x64}
          - {os: windows-2022, platform: windows, arch: x64}
          - {os: macos-15, platform: macos, arch: arm64}
          - {os: macos-15, platform: macos, arch: x64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate desktop version and changelog contract
        run: python3 scripts/test-desktop-release.py
      - name: Install the repository-pinned Flutter SDK
        run: |
          git init "$RUNNER_TEMP/native-flutter"
          git -C "$RUNNER_TEMP/native-flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/native-flutter" fetch --depth 1 origin refs/tags/3.32.0-0.2.pre:refs/tags/3.32.0-0.2.pre
          git -C "$RUNNER_TEMP/native-flutter" checkout --detach d3abd00e69a89a615e13969c02832ef1e0119639
          test "$(git -C "$RUNNER_TEMP/native-flutter" rev-parse HEAD)" = d3abd00e69a89a615e13969c02832ef1e0119639
          echo "$RUNNER_TEMP/native-flutter/bin" >> "$GITHUB_PATH"
      - name: Install native Linux dependencies and credential service
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libjsoncpp-dev liblzma-dev libssl-dev libpulse-dev libasound2-dev libx11-dev libxext-dev libxrandr-dev libxfixes-dev libxdamage-dev libxtst-dev libgbm-dev xvfb gnome-keyring dbus-x11
      - name: Build and exercise the complete native application
        if: runner.os != 'Linux'
        run: python3 scripts/desktop-build.py '${{ matrix.platform }}' '${{ matrix.arch }}'
      - name: Build and exercise the complete native Linux application
        if: runner.os == 'Linux'
        run: dbus-run-session -- sh -c 'printf ci-smoke | gnome-keyring-daemon --unlock --components=secrets; xvfb-run -a python3 scripts/desktop-build.py linux x64'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-${{ matrix.platform }}-${{ matrix.arch }}
          path: desktop-dist/*.zip
          if-no-files-found: error
          retention-days: 7

  desktop-verify:
    needs: desktop
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: native-*
          path: desktop-dist
          merge-multiple: true
      - name: Verify all native targets and stage immutable Store metadata
        run: python3 scripts/desktop-release.py stage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-desktop-release
          path: desktop-dist/*
          if-no-files-found: error
          retention-days: 7

  desktop-publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [deploy, desktop-verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-desktop-release
          path: desktop-dist
      - name: Publish verified native apps, changelog and checksums for Private Store
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/desktop-release.py publish
